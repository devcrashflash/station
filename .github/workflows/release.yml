name: Release Station

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/validate-release.mjs "${{ github.ref_name }}"
      - name: Create or validate draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" --jq .draft)" = "true"
          else
            gh release create "$RELEASE_TAG" --draft --generate-notes --title "Station $RELEASE_TAG" --target "${{ github.sha }}"
          fi

  build:
    name: Build macOS (${{ matrix.name }})
    needs: prepare
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            target: aarch64-apple-darwin
          - name: Intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Station __VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target ${{ matrix.target }} --bundles app,dmg

  publish:
    name: Validate and publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download and validate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/station-release"
          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')"
          test -n "$RELEASE_ID"
          LATEST_JSON_ASSET_ID="$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "latest.json") | .id')"
          test -n "$LATEST_JSON_ASSET_ID"
          gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$LATEST_JSON_ASSET_ID" > "$RUNNER_TEMP/station-release/latest.json"
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" --jq '[.assets[] | {id, name}]' > "$RUNNER_TEMP/station-release/assets.json"
          node scripts/validate-updater-manifest.mjs "$RUNNER_TEMP/station-release/latest.json" "$RUNNER_TEMP/station-release/assets.json" "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
